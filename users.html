<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rieker — Quản Lý Người Dùng</title>
    <meta name="description" content="Quản lý tài khoản công nhân, kỹ thuật viên và quản trị viên Rieker Vietnam">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/views.css">
    <script>
        (function() {
            const saved = localStorage.getItem('rieker_theme') || 'dark';
            if (saved === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <style>
        .users-page-grid { display: grid; grid-template-columns: 1fr; gap: 1.25rem; align-items: start; }
        .user-list-panel { padding: 1.25rem; }
        .user-list-panel .card-header { margin-bottom: 1rem; }
        .user-table-wrap { overflow-x: auto; }

        .role-badge {
            padding: 2px 8px;
            border-radius: var(--border-radius-xs);
            font-size: 0.7rem;
            font-weight: 700;
            display: inline-block;
        }
        .role-admin      { background: rgba(0,212,255,0.1);  color: var(--primary); border: 1px solid rgba(0,212,255,0.25); }
        .role-technician { background: rgba(245,158,11,0.1); color: var(--p2-amber); border: 1px solid rgba(245,158,11,0.25); }
        .role-worker     { background: rgba(16,185,129,0.1); color: var(--success); border: 1px solid rgba(16,185,129,0.25); }

        .action-btns { display: flex; gap: 0.35rem; justify-content: center; }
        .action-btns button { padding: 3px 8px; font-size: 0.72rem; }

        .search-bar { display: flex; gap: 0.625rem; margin-bottom: 1rem; }
        .search-bar input { flex: 1; }

        .empty-row td { text-align: center; padding: 2.5rem; color: var(--text-muted); }
        .empty-row td i { font-size: 1.75rem; display: block; margin-bottom: 0.5rem; opacity: 0.3; }
    </style>
</head>
<body>
<div class="app-container">
    <div id="sidebar-container"></div>
    <main class="main-content">
        <div id="header-container"></div>
        <div class="content-wrapper">
            <section class="view-section active">
                <div class="view-header">
                    <div>
                        <h1 class="view-title">Quản Lý Nhân Sự &amp; Người Dùng</h1>
                        <p class="view-subtitle">Phân quyền tài khoản công nhân xưởng, kỹ thuật viên bảo trì và quản trị viên</p>
                    </div>
                </div>

                <div class="users-page-grid">
                    <div class="user-list-panel glass-panel">
                        <div class="card-header">
                            <h3><i class="fa-solid fa-users" style="color:var(--primary);margin-right:8px;"></i>Danh Sách Tài Khoản Nhân Viên</h3>
                            <span class="text-xs text-muted font-mono" id="userCount">Đang tải...</span>
                        </div>
                        <div class="search-bar">
                            <input type="text" id="searchUser" placeholder="🔍 Tìm kiếm theo tên hoặc tên đăng nhập...">
                        </div>
                        <div class="user-table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Họ Và Tên</th>
                                        <th>Tên Đăng Nhập</th>
                                        <th>Email Liên Kết</th>
                                        <th>Vai Trò</th>
                                        <th>Bộ Phận Trực Thuộc</th>
                                        <th>Trạng Thái</th>
                                        <th style="text-align:center">Thao Tác</th>
                                    </tr>
                                </thead>
                                <tbody id="usersBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>

<!-- Confirm Modal -->
<div class="modal" id="confirmModal">
    <div class="modal-content glass-panel">
        <div class="modal-icon" style="background:var(--p1-bg);color:var(--p1-red);box-shadow:0 0 16px var(--p1-glow);">
            <i class="fa-solid fa-trash"></i>
        </div>
        <h2>Xác Nhận Xóa Tài Khoản</h2>
        <p id="confirmMsg"></p>
        <div style="display:flex;gap:0.75rem;justify-content:center;">
            <button class="btn btn-outline" id="cancelDelete">Hủy Bỏ</button>
            <button class="btn btn-danger" id="confirmDelete">Xác Nhận Xóa</button>
        </div>
    </div>
</div>

<!-- Sonner / Stacked Toast Container -->
<div id="sonner-container" class="sonner-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="scripts/store.js?v=13"></script>
<script src="scripts/ui.js?v=13"></script>
<script src="scripts/auth.js?v=13"></script>
<script src="scripts/components.js?v=13"></script>
<script>
    const user = window.auth.requireAuth();
    if (!user || user.role !== 'admin') {
        window.location.href = user ? 'index.html' : 'login.html';
        throw new Error('redirect');
    }
    document.getElementById('sidebar-container').innerHTML = window.renderSidebar('users');
    document.getElementById('header-container').innerHTML = window.renderHeader();

    let allUsers = [];
    let deleteTargetId = null;

    const roleLabel = { admin: 'Quản Trị Viên', technician: 'Kỹ Thuật Viên', worker: 'Công Nhân' };
    const roleBadge = { admin: 'role-admin', technician: 'role-technician', worker: 'role-worker' };

    function getDeptFromRole(role) {
        if (role === 'admin')      return 'Quản trị hệ thống';
        if (role === 'technician') return 'Phòng Bảo Trì Cơ Điện';
        return 'Xưởng sản xuất';
    }

    function renderUsers(data) {
        const tbody = document.getElementById('usersBody');
        document.getElementById('userCount').textContent = `${data.length} tài khoản`;
        if (data.length === 0) {
            tbody.innerHTML = `<tr class="empty-row"><td colspan="7"><i class="fa-solid fa-users-slash"></i>Chưa có tài khoản nào</td></tr>`;
            return;
        }
        tbody.innerHTML = data.map(u => {
            const userEmail = u.email || (window.auth && window.auth.getUserEmail(u.id)) || (window.auth && window.auth.getUserEmail(u.username)) || '—';
            return `
            <tr>
                <td><strong>${u.name}</strong></td>
                <td><code class="font-mono">${u.username}</code></td>
                <td><span class="font-mono text-xs" style="color:var(--primary);">${userEmail}</span></td>
                <td><span class="role-badge ${roleBadge[u.role] || 'role-worker'}">${roleLabel[u.role] || u.role}</span></td>
                <td>${u.department || getDeptFromRole(u.role)}</td>
                <td>
                    <span class="badge-status ${u.status === 'active' ? 'status-completed' : 'status-p1'}">
                        <span class="led-dot ${u.status === 'active' ? 'success' : 'p1-danger'}"></span>
                        ${u.status === 'active' ? 'Hoạt Động' : 'Đã Khóa'}
                    </span>
                </td>
                <td>
                    <div class="action-btns">
                        <button class="btn btn-sm btn-secondary" onclick="window.toggleStatus('${u.id}','${u.status}')">
                            <i class="fa-solid fa-${u.status === 'active' ? 'lock' : 'lock-open'}"></i>
                            ${u.status === 'active' ? 'Khóa' : 'Mở'}
                        </button>
                        <button class="btn btn-sm btn-outline danger" onclick="window.openDelete('${u.id}','${u.name}')" title="Xóa tài khoản">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </td>
            </tr>
            `;
        }).join('');
    }

    async function loadUsers() {
        const tbody = document.getElementById('usersBody');
        tbody.innerHTML =
            `<tr><td colspan="7" style="text-align:center;padding:2rem;"><div class="spinner" style="border-width:2px;width:20px;height:20px;border-top-color:#00d4ff;margin-right:8px;"></div>Đang tải tài khoản...</td></tr>`;
        
        try {
            if (typeof window.fetchUsers === 'function') {
                allUsers = await window.fetchUsers();
            } else if (window.supabaseClient) {
                const { data, error } = await window.supabaseClient.from('app_users').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                allUsers = data || [];
            }
        } catch (e) {
            console.error('Lỗi loadUsers:', e);
            allUsers = [];
        }

        renderUsers(allUsers);
    }

    document.getElementById('searchUser').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        renderUsers(q ? allUsers.filter(u =>
            u.name.toLowerCase().includes(q) ||
            u.username.toLowerCase().includes(q) ||
            u.role.toLowerCase().includes(q)
        ) : allUsers);
    });

    window.toggleStatus = async (id, currentStatus) => {
        const newStatus = currentStatus === 'active' ? 'inactive' : 'active';
        await window.toggleUserStatus(id, newStatus);
        window.showSonnerToast && window.showSonnerToast({
            title: 'Đã Cập Nhật Trạng Thái',
            description: `Tài khoản đã chuyển sang: ${newStatus === 'active' ? 'Hoạt động' : 'Đã khóa'}`,
            level: 'info',
            playSound: false
        });
        loadUsers();
    };

    window.openDelete = (id, name) => {
        deleteTargetId = id;
        document.getElementById('confirmMsg').textContent = `Bạn có chắc muốn xóa tài khoản "${name}" khỏi hệ thống?`;
        document.getElementById('confirmModal').classList.add('show');
    };

    document.getElementById('cancelDelete').addEventListener('click', () => {
        document.getElementById('confirmModal').classList.remove('show');
        deleteTargetId = null;
    });

    document.getElementById('confirmDelete').addEventListener('click', async () => {
        if (!deleteTargetId) return;
        document.getElementById('confirmModal').classList.remove('show');
        await window.deleteUser(deleteTargetId);
        deleteTargetId = null;
        window.showSonnerToast && window.showSonnerToast({
            title: 'Đã Xóa Thành Công',
            description: 'Tài khoản người dùng đã bị xóa',
            level: 'info',
            playSound: false
        });
        loadUsers();
    });

    loadUsers();
</script>
</body>
</html>
